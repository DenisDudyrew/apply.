name: Android APK
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed APK for GitHub Release (requires Android signing secrets)
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix frontend
      - name: Run offline regression tests
        run: python -m unittest -q
      - name: Build UI and stage public resources
        run: |
          npm run build --prefix frontend
          python scripts/prepare_android.py
      - name: Build test APK
        if: ${{ !inputs.signed }}
        run: ./android/gradlew -p android :app:assembleDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test background service, notifications and encrypted storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./android/gradlew -p android :app:connectedDebugAndroidTest --console=plain
      - name: Build signed release APK
        if: ${{ inputs.signed }}
        env:
          APPLY_ANDROID_KEYSTORE_BASE64: ${{ secrets.APPLY_ANDROID_KEYSTORE_BASE64 }}
          APPLY_ANDROID_STORE_PASSWORD: ${{ secrets.APPLY_ANDROID_STORE_PASSWORD }}
          APPLY_ANDROID_KEY_PASSWORD: ${{ secrets.APPLY_ANDROID_KEY_PASSWORD }}
          APPLY_ANDROID_KEY_ALIAS: ${{ secrets.APPLY_ANDROID_KEY_ALIAS }}
          APPLY_ANDROID_KEYSTORE: ${{ runner.temp }}/apply-signing.p12
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['APPLY_ANDROID_KEYSTORE_BASE64']
          assert value and os.environ['APPLY_ANDROID_STORE_PASSWORD'] and os.environ['APPLY_ANDROID_KEY_PASSWORD'], 'Configure Android signing secrets first'
          path = Path(os.environ['APPLY_ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
          python scripts/build_android.py
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.signed }}
        with:
          name: Apply-Android-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.signed }}
        with:
          name: Apply-Android
          path: release/*-Android.apk
          if-no-files-found: error
