name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-Apple-Silicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # A trailing dot in the repository name is invalid as a Windows folder.
      - name: Check out source into a portable folder
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git clone --no-checkout "https://github.com/${SOURCE_REPOSITORY}.git" apply-source
          git -C apply-source checkout "$SOURCE_COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Rust
        shell: bash
        working-directory: ${{ runner.temp }}/apply-source
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/apply-source
        run: python -m pip install -r requirements-build.txt
      - name: Build frontend
        working-directory: ${{ runner.temp }}/apply-source
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Run offline regression tests
        working-directory: ${{ runner.temp }}/apply-source
        run: python -m unittest -q
      - name: Build standalone engine and installer
        working-directory: ${{ runner.temp }}/apply-source
        run: python scripts/build_desktop.py
      - name: Test standalone engine on a clean profile
        working-directory: ${{ runner.temp }}/apply-source
        run: python scripts/test_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: Apply-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/apply-source/src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/apply-source/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
