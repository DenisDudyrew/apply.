name: Desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-Apple-Silicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Run offline regression tests
        run: python -m unittest -q
      - name: Build standalone engine and installer
        run: python scripts/build_desktop.py
      - name: Test standalone engine on a clean profile
        run: python scripts/test_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: Apply-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
